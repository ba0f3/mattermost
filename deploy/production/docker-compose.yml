name: ${COMPOSE_PROJECT_NAME:-mattermost-production}

services:
  mattermost:
    # A release image containing this fork's server, webapp and mmctl binaries.
    image: ${MATTERMOST_IMAGE:?Set MATTERMOST_IMAGE to a pinned release image or digest}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 1024
    mem_limit: ${MATTERMOST_MEMORY_LIMIT:-4g}
    ports:
      - "${MATTERMOST_BIND_IP:-127.0.0.1}:${MATTERMOST_HTTP_PORT:-8065}:8065"
    environment:
      TZ: ${TZ:-UTC}
      MM_SERVICESETTINGS_SITEURL: ${MM_SERVICESETTINGS_SITEURL:?Set the public HTTPS URL}
      MM_SERVICESETTINGS_LISTENADDRESS: ":8065"
      MM_SERVICESETTINGS_CONNECTIONSECURITY: ""
      MM_SERVICESETTINGS_WEBSERVERMODE: gzip
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "false"
      MM_SERVICESETTINGS_ENABLETESTING: "false"
      # The socket stays inside the container; used by mmctl and the healthcheck.
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_LOCALMODESOCKETLOCATION: /var/tmp/mattermost_local.socket

      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: ${MM_SQLSETTINGS_DATASOURCE:?Set the external PostgreSQL connection URL}
      MM_SQLSETTINGS_MAXIDLECONNS: ${MM_SQLSETTINGS_MAXIDLECONNS:-10}
      MM_SQLSETTINGS_MAXOPENCONNS: ${MM_SQLSETTINGS_MAXOPENCONNS:-100}
      MM_SQLSETTINGS_CONNMAXLIFETIMEMILLISECONDS: ${MM_SQLSETTINGS_CONNMAXLIFETIMEMILLISECONDS:-3600000}
      MM_SQLSETTINGS_QUERYTIMEOUT: ${MM_SQLSETTINGS_QUERYTIMEOUT:-30}
      MM_SQLSETTINGS_MIGRATIONSSTATEMENTTIMEOUTSECONDS: ${MM_SQLSETTINGS_MIGRATIONSSTATEMENTTIMEOUTSECONDS:-100000}

      MM_FILESETTINGS_DRIVERNAME: amazons3
      MM_FILESETTINGS_DIRECTORY: /mattermost/data
      MM_FILESETTINGS_AMAZONS3ACCESSKEYID: ${MM_FILESETTINGS_AMAZONS3ACCESSKEYID:?Set the S3 access key}
      MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY: ${MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY:?Set the S3 secret key}
      MM_FILESETTINGS_AMAZONS3BUCKET: ${MM_FILESETTINGS_AMAZONS3BUCKET:?Set the existing S3 bucket}
      MM_FILESETTINGS_AMAZONS3REGION: ${MM_FILESETTINGS_AMAZONS3REGION:-us-east-1}
      MM_FILESETTINGS_AMAZONS3ENDPOINT: ${MM_FILESETTINGS_AMAZONS3ENDPOINT:-}
      MM_FILESETTINGS_AMAZONS3PATHPREFIX: ${MM_FILESETTINGS_AMAZONS3PATHPREFIX:-}
      MM_FILESETTINGS_AMAZONS3SSL: ${MM_FILESETTINGS_AMAZONS3SSL:-true}
      MM_FILESETTINGS_AMAZONS3SIGNV2: "false"
      MM_FILESETTINGS_AMAZONS3SSE: ${MM_FILESETTINGS_AMAZONS3SSE:-false}
      MM_FILESETTINGS_AMAZONS3TRACE: "false"
      MM_FILESETTINGS_PUBLICLINKSALT: ${MM_FILESETTINGS_PUBLICLINKSALT:?Generate a stable random salt of at least 32 characters}
      MM_FILESETTINGS_MAXFILESIZE: ${MM_FILESETTINGS_MAXFILESIZE:-104857600}

      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: ${MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS:-true}
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: ${MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION:-true}
      MM_EMAILSETTINGS_FEEDBACKNAME: ${MM_EMAILSETTINGS_FEEDBACKNAME:-Mattermost}
      MM_EMAILSETTINGS_FEEDBACKEMAIL: ${MM_EMAILSETTINGS_FEEDBACKEMAIL:-}
      MM_EMAILSETTINGS_REPLYTOADDRESS: ${MM_EMAILSETTINGS_REPLYTOADDRESS:-}
      MM_EMAILSETTINGS_ENABLESMTPAUTH: ${MM_EMAILSETTINGS_ENABLESMTPAUTH:-true}
      MM_EMAILSETTINGS_SMTPUSERNAME: ${MM_EMAILSETTINGS_SMTPUSERNAME:-}
      MM_EMAILSETTINGS_SMTPPASSWORD: ${MM_EMAILSETTINGS_SMTPPASSWORD:-}
      MM_EMAILSETTINGS_SMTPSERVER: ${MM_EMAILSETTINGS_SMTPSERVER:-}
      MM_EMAILSETTINGS_SMTPPORT: ${MM_EMAILSETTINGS_SMTPPORT:-587}
      MM_EMAILSETTINGS_CONNECTIONSECURITY: ${MM_EMAILSETTINGS_CONNECTIONSECURITY:-STARTTLS}
      MM_EMAILSETTINGS_SKIPSERVERCERTIFICATEVERIFICATION: "false"
      MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: ${MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS:-false}
      MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER: ${MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER:-}

      MM_TEAMSETTINGS_SITENAME: ${MM_TEAMSETTINGS_SITENAME:-Mattermost}
      MM_TEAMSETTINGS_ENABLEOPENSERVER: ${MM_TEAMSETTINGS_ENABLEOPENSERVER:-false}
      MM_TEAMSETTINGS_ENABLEUSERCREATION: ${MM_TEAMSETTINGS_ENABLEUSERCREATION:-true}
      MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: ${MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL:-true}
      MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL: ${MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL:-true}
      MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME: ${MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME:-true}

      # Native OIDC requires its provider in the image and the appropriate license.
      # These settings do not configure the separate mattermost-oidc plugin.
      MM_OPENIDSETTINGS_ENABLE: ${MM_OPENIDSETTINGS_ENABLE:-false}
      MM_OPENIDSETTINGS_ID: ${MM_OPENIDSETTINGS_ID:-}
      MM_OPENIDSETTINGS_SECRET: ${MM_OPENIDSETTINGS_SECRET:-}
      MM_OPENIDSETTINGS_DISCOVERYENDPOINT: ${MM_OPENIDSETTINGS_DISCOVERYENDPOINT:-}
      MM_OPENIDSETTINGS_SCOPE: ${MM_OPENIDSETTINGS_SCOPE:-openid profile email}
      MM_OPENIDSETTINGS_BUTTONTEXT: ${MM_OPENIDSETTINGS_BUTTONTEXT:-Keycloak}
      MM_OPENIDSETTINGS_USEPREFERREDUSERNAME: ${MM_OPENIDSETTINGS_USEPREFERREDUSERNAME:-true}

      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: ${MM_PLUGINSETTINGS_ENABLEUPLOADS:-false}
      MM_PLUGINSETTINGS_DIRECTORY: /mattermost/plugins
      MM_PLUGINSETTINGS_CLIENTDIRECTORY: /mattermost/client/plugins
      MM_LOGSETTINGS_ENABLECONSOLE: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: ${MM_LOGSETTINGS_CONSOLELEVEL:-INFO}
      MM_LOGSETTINGS_CONSOLEJSON: "true"
      MM_LOGSETTINGS_ENABLEFILE: "false"
      MM_LOGSETTINGS_FILELOCATION: /mattermost/logs/mattermost.log
      MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: "true"
    volumes:
      - config:/mattermost/config
      - data:/mattermost/data
      - logs:/mattermost/logs
      - plugins:/mattermost/plugins
      - client_plugins:/mattermost/client/plugins
      - bleve_indexes:/mattermost/bleve-indexes
      # For private PostgreSQL CAs, mount a PEM file here and add
      # sslrootcert=/mattermost/certs/postgres-ca.crt to the database URL.
      # - ./certs/postgres-ca.crt:/mattermost/certs/postgres-ca.crt:ro
    healthcheck:
      test: ["CMD", "/mattermost/bin/mmctl", "system", "status", "--local"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  config:
  data:
  logs:
  plugins:
  client_plugins:
  bleve_indexes:
