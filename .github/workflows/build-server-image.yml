name: BuildEnv Docker Image

on:
  push:
    branches:
      - master
      - release-*
    paths:
      - server/build/Dockerfile.buildenv
      - server/build/Dockerfile.buildenv-fips
      - server/build/buildenv-tag.sh
      - server/.go-version
      - .nvmrc
      - mise.toml
      - .github/workflows/build-server-image.yml
  pull_request:
    paths:
      - server/build/Dockerfile.buildenv
      - server/build/Dockerfile.buildenv-fips
      - server/build/buildenv-tag.sh
      - server/.go-version
      - .nvmrc
      - mise.toml
      - .github/workflows/build-server-image.yml
  workflow_dispatch:

env:
  CHAINCTL_IDENTITY: ee399b4c72dd4e58e3d617f78fc47b74733c9557/922f2d48307d6f5f

permissions: {}

jobs:
  build-image:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-22.04
    steps:
      - name: buildenv/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: buildenv/image-name
        id: image
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/mattermost-build-server" >> "${GITHUB_OUTPUT}"

      - name: buildenv/docker-login
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: buildenv/build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          provenance: false
          file: server/build/Dockerfile.buildenv
          load: true
          push: false
          pull: false
          tags: ${{ steps.image.outputs.name }}:test

      - name: buildenv/test
        run: |
          docker run --rm ${{ steps.image.outputs.name }}:test /bin/sh -c "go version && node --version"

      - name: buildenv/calculate-tag
        id: tag
        run: |
          tag=$(./server/build/buildenv-tag.sh)
          echo "TAG=${tag}" >> "${GITHUB_OUTPUT}"

      - name: buildenv/push
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release-')
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          provenance: false
          file: server/build/Dockerfile.buildenv
          load: false
          push: true
          pull: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.TAG }}

  build-image-fips:
    # FIPS images are built with Mattermost's private Chainguard identity.
    if: github.repository_owner == 'mattermost'
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-22.04
    steps:
      - uses: chainguard-dev/setup-chainctl@c125f765e82b09a42af3185f3214465314d75c5d # v0.5.0
        with:
          identity: ${{ env.CHAINCTL_IDENTITY }}
      - name: buildenv/checkout-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: buildenv/image-name
        id: image
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/mattermost-build-server-fips" >> "${GITHUB_OUTPUT}"

      - name: buildenv/docker-login
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: buildenv/build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          provenance: false
          file: server/build/Dockerfile.buildenv-fips
          load: true
          push: false
          pull: false
          tags: ${{ steps.image.outputs.name }}:test

      - name: buildenv/test
        run: |
          docker run --rm --entrypoint bash ${{ steps.image.outputs.name }}:test -c "go version && node --version"

      - name: buildenv/calculate-tag
        id: tag
        run: |
          tag=$(./server/build/buildenv-tag.sh)
          echo "TAG=${tag}" >> "${GITHUB_OUTPUT}"

      - name: buildenv/push
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release-')
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          provenance: false
          file: server/build/Dockerfile.buildenv-fips
          load: false
          push: true
          pull: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.TAG }}
